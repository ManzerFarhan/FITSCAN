# Deploys backend/ to a Hugging Face Docker Space whenever it changes on main,
# and pings it twice a day so the free Space never goes to sleep.
#
# One-time setup (GitHub repo -> Settings -> Secrets and variables -> Actions):
#   secret   HF_TOKEN  - Hugging Face access token with "write" permission
#   variable HF_SPACE  - the Space id, e.g. your-hf-username/fitscan-api
# The Space's own secrets (DATABASE_URL, JWT_SECRET, GEMINI_API_KEY, ...) are set on Hugging Face, never here.
name: Deploy backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/deploy-backend.yml"]
  workflow_dispatch:
  schedule:
    - cron: "17 */12 * * *"

concurrency: { group: deploy-backend, cancel-in-progress: true }

jobs:
  deploy:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push backend/ to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          test -n "$HF_TOKEN" && test -n "$HF_SPACE" || { echo "Set the HF_TOKEN secret and HF_SPACE variable first."; exit 1; }
          mkdir space
          rsync -a --exclude tests --exclude .coverage backend/ space/
          cat > space/README.md <<'EOF'
          ---
          title: FITSCAN API
          emoji: 🩺
          colorFrom: green
          colorTo: blue
          sdk: docker
          app_port: 8000
          pinned: false
          ---
          Backend API for FITSCAN. Source: the GitHub repository's backend/ folder (deployed by GitHub Actions).
          EOF
          cd space
          git init -q -b main
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA::7}"
          git push --force "https://hf:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main

  keep-awake:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Ping the API
        env:
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          host="$(echo "$HF_SPACE" | tr '/_.' '---' | tr 'A-Z' 'a-z').hf.space"
          curl -fsS --retry 5 --retry-delay 30 --max-time 120 "https://${host}/api/v1/health" || true
