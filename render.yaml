# Render Blueprint for the FITSCAN backend (free plan). The website is on Vercel and forwards /api/v1/* here.
# Secrets marked "sync: false" are entered in the Render dashboard (or via its API), never committed.
services:
  - type: web
    name: fitscan-api
    runtime: docker
    plan: free
    region: singapore          # same region as the Neon database
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/ping
    autoDeployTrigger: commit  # every push to main redeploys
    envVars:
      - key: APP_ENV
        value: production
      - key: STORAGE_BACKEND
        value: db              # uploaded files live in Postgres (free plan has no persistent disk)
      - key: FRONTEND_ORIGIN
        value: https://fitscan-smoky.vercel.app
      - key: WEB_CONCURRENCY
        value: "1"             # 512 MB RAM: one worker...
      - key: OCR_POOL_SIZE
        value: "1"             # ...with one OCR engine
      - key: OCR_THREADS
        value: "1"
      - key: OCR_DET_MAX_SIDE
        value: "960"           # text detection on a 960 px copy (PP-OCR default); reading stays full-res
      # Free instances get a slice of one CPU but see every host core: without these, OpenCV/BLAS start a thread
      # (and buffers) per host core and glibc keeps a memory arena per thread - enough to exceed 512 MB.
      - key: CV_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: CENTRE_PROVIDER
        value: osm
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false            # Neon connection string
      - key: GEMINI_API_KEY
        sync: false            # chatbot
