services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fitscan
      POSTGRES_PASSWORD: fitscan
      POSTGRES_DB: fitscan
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitscan"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://fitscan:fitscan@postgres:5432/fitscan
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_started }
    profiles: ["full"]

volumes:
  pgdata:
  miniodata:
